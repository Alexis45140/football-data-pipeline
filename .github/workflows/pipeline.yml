name: pipeline

on:
  schedule:
    # Tous les jours a 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Nombre de pages API a extraire (une requete par page)"
        default: "2"

# Deux runs simultanes ecriraient dans la meme table
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  elt:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      BQ_DATASET: football_data
      DBT_PROFILES_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Extract
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # Quota RapidAPI : 100 requetes par mois, une par page de 50 transferts.
          # 2 pages par jour : 62 requetes au plus sur un mois de 31 jours.
          EXTRACT_PAGES: ${{ inputs.pages || '2' }}
        run: python scripts/extract_transfers.py

      - name: Transform
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cp profiles.yml.example profiles.yml
          dbt deps
          dbt build --target prod

      - name: Documentation
        if: always()
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: dbt docs generate --target prod

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-target
          path: target/
          retention-days: 14
