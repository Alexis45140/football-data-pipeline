version: 2

models:
  - name: fct_transfer_analysis
    description: >
      Table de faits alimentant le dashboard, reconstruite a chaque run
      depuis l'historique accumule dans transfers_raw.
    columns:
      - name: transfer_id
        tests:
          - unique
          - not_null
      - name: montant
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: type_transfert
        tests:
          - not_null
